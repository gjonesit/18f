---
layout: app
title: Webmail
permalink: /webmail/
script: /assets/js/webmail.js
---
<div class="mail">
  <aside class="folders">
    <button id="new" class="btn yellow wide" type="button">Nuovo messaggio</button>
    <ul id="folderlist"><li class="muted">Carico cartelle…</li></ul>
  </aside>
  <section class="list">
    <div class="listhead"><strong id="foldername">Posta in arrivo</strong>
      <span><button id="prev" class="btn ghost sm" type="button" aria-label="Pagina precedente">‹</button>
      <button id="next" class="btn ghost sm" type="button" aria-label="Pagina successiva">›</button>
      <button id="refresh" class="btn ghost sm" type="button">Aggiorna</button></span></div>
    <ul id="msgs"></ul>
  </section>
  <article class="reader" id="reader"><p class="empty">Seleziona un messaggio per leggerlo.</p></article>
</div>

<dialog id="compose">
  <form id="cf" method="dialog" class="composebox">
    <h2>Nuovo messaggio</h2>
    <label>A <input name="to" type="text" required placeholder="nome@esempio.it, altro@esempio.it"></label>
    <label>Oggetto <input name="subject"></label>
    <textarea name="body" rows="12" placeholder="Scrivi qui…"></textarea>
    <p id="cerr" class="err" role="alert"></p>
    <div class="actions">
      <button class="btn dark" id="send" type="submit">Invia</button>
      <button class="btn ghost" id="cancel" type="button">Annulla</button>
    </div>
  </form>
</dialog>
