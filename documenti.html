---
layout: default
title: Documenti
permalink: /documenti/
script: /assets/js/documenti.js
body_class: app
---
<div id="lh" hidden
  data-name="{{ site.letterhead.name }}" data-tagline="{{ site.letterhead.tagline }}"
  data-address="{{ site.letterhead.address }}" data-email="{{ site.letterhead.email }}"
  data-phone="{{ site.letterhead.phone }}" data-web="{{ site.letterhead.web }}" data-vat="{{ site.letterhead.vat }}"></div>

<div class="docs">
  <form id="f" class="panel" autocomplete="off">
    <h1>Nuovo documento</h1>
    <label>Modello
      <select name="tpl">
        <option value="lettera">Lettera</option>
        <option value="circolare">Circolare / comunicazione</option>
        <option value="dichiarazione">Dichiarazione</option>
        <option value="libero">Testo libero</option>
      </select>
    </label>
    <div class="row">
      <label>Luogo <input name="luogo" value="Milano"></label>
      <label>Data <input name="data" type="date"></label>
    </div>
    <label>Destinatario <textarea name="dest" rows="3" placeholder="Spett.le ...&#10;Via ...&#10;CAP Città"></textarea></label>
    <label>Oggetto <input name="ogg" placeholder="Oggetto del documento"></label>
    <label>Testo <textarea name="corpo" rows="10"></textarea></label>
    <div class="row">
      <label>Saluti <input name="saluti" value="Cordiali saluti,"></label>
      <label>Firma <input name="firma" value="Gabriel Jones"></label>
    </div>
    <div class="actions">
      <button type="button" class="btn dark" id="pdf">Stampa / Salva PDF</button>
      <button type="button" class="btn yellow" id="word">Scarica Word</button>
      <button type="button" class="btn ghost" id="reset">Svuota</button>
    </div>
    <p class="hint">La bozza si salva da sola in questo browser.</p>
  </form>

  <div class="preview"><div id="sheet" class="sheet"></div></div>
</div>
